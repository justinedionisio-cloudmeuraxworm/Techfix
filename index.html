<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechFix — Sign In</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/pages/login.css" />
</head>
<body>

  <div class="auth-shell">
    <div class="auth-card">

      <div class="auth-card__brand">
        <div class="topbar__brand-mark">🖥️</div>
        <span>TechFix</span>
      </div>

      <h1 class="auth-card__title">Computer Troubleshooting<br />Simulation Game</h1>
      <p class="auth-card__subtitle text-muted">
        Practice real computer troubleshooting skills through interactive
        missions — built for Senior High School students of every strand.
      </p>

      <button class="google-btn" id="googleSignInBtn" type="button">
        <span class="google-btn__icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.3-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 16.1 3 9.2 7.4 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 45c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 36.4 26.7 37 24 37c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.1 40.5 16 45 24 45z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C40.8 36 44 30.6 44 24c0-1.4-.1-2.3-.4-3.5z"/>
          </svg>
        </span>
        Continue with Google
      </button>

      <p class="auth-card__note">
        For this prototype, signing in creates a local demo profile —
        no real Google account is contacted yet.
      </p>
    </div>
  </div>

  <script src="js/core/storage.js"></script>
  <script src="js/core/player.js"></script>
  <script src="js/core/navigation.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
